name: Deploy to Fly

# Deploys the app to Fly.io. Runs on every push to main, and can be triggered
# by hand from the Actions tab. Requires a repo secret named FLY_API_TOKEN
# (create a token with `fly tokens create deploy -a origin-coffee`, then add it
# under Settings -> Secrets and variables -> Actions). Until that secret exists
# this workflow is inert: it will fail fast on the deploy step and change nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

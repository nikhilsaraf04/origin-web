app = "origin-coffee"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "::"
  NEXT_TELEMETRY_DISABLED = "1"
  ORIGIN_DB_PATH = "/data/origin.db"

# SQLite lives on a persistent volume so logs survive deploys/restarts.
[mounts]
  source = "origin_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/sign-in"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
